
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chalk - Premium Billiards Training</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "off-white": "#F9F9F8",
                        "deep-charcoal": "#1A1A1A",
                        "chalk-blue": "#87CEEB",
                        "chalk-blue-dark": "#70B8D4",
                        "soft-gray": "#E5E5E5",
                        "muted-text": "#666666",
                        "dark-bg": "#121212",
                        "dark-surface": "#1E1E1E",
                        "dark-border": "#2D2D2D",
                        "dark-text-muted": "#A0A0A0"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-down': 'slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-left': 'slideLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'zoom-in': 'zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'bounce-subtle': 'bounceSubtle 2s infinite ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        slideLeft: {
                            '0%': { transform: 'translateX(20px)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                        zoomIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' },
                        }
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .input-field {
                @apply w-full bg-white dark:bg-dark-surface border border-soft-gray dark:border-dark-border rounded-2xl py-4 px-6 text-deep-charcoal dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-chalk-blue/20 focus:border-chalk-blue transition-all duration-300;
            }
            .btn-primary {
                @apply w-full bg-chalk-blue hover:bg-chalk-blue-dark text-deep-charcoal font-bold py-4 rounded-2xl transition-all duration-300 shadow-lg shadow-chalk-blue/20 active:scale-[0.97] text-base;
            }
            .btn-secondary {
                @apply flex items-center justify-center gap-3 bg-white dark:bg-dark-surface border border-soft-gray dark:border-dark-border hover:bg-gray-50 dark:hover:bg-black/20 rounded-2xl py-3.5 transition-all duration-300 text-sm font-semibold text-deep-charcoal dark:text-white;
            }
            .stagger-item-1 { animation-delay: 100ms; }
            .stagger-item-2 { animation-delay: 200ms; }
            .stagger-item-3 { animation-delay: 300ms; }
            .stagger-item-4 { animation-delay: 400ms; }
            .stagger-item-5 { animation-delay: 500ms; }
        }
        body {
            @apply bg-off-white dark:bg-dark-bg text-deep-charcoal dark:text-white min-h-[100dvh] transition-colors duration-500 overflow-hidden;
        }
        /* Hide scrollbars but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Smooth transitions for all properties */
        * {
            transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@supabase/supabase.js" : "https://esm.sh/@supabase/supabase-js@^2.48.1", 
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>

</head>

</body>
</html>
